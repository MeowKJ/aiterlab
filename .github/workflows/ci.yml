name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  verify:
    name: Verify auto-iteration
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Syntax check
        run: pnpm run test:syntax

      - name: Unit and integration tests
        run: pnpm test

      - name: Full verification
        run: pnpm run verify
