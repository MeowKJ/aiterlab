name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  verify:
    name: Verify auto-iteration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check
        run: npm run test:syntax

      - name: Unit and integration tests
        run: npm test

      - name: Full verification
        run: npm run verify
